name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: legacy
            ref: 9fc80ac70f6b97e36556c33bc4895b75558d4136
            python: "3.11"
            isolation: in_process
          - host: shared-gateway
            ref: 1f2b9e08644c6de4a5b5c50d0e4676a19c5577c5
            python: "3.14"
            isolation: in_process
          # Unreleased host transport candidate, not a released-support claim.
          - host: host-candidate
            ref: c72f29e0a3608e2276e311c1c9a891aedf2acb17
            python: "3.14"
            isolation: host
    name: Hermes ${{ matrix.host }} (${{ matrix.isolation }})
    steps:
      - name: Prepare isolated directories
        run: |
          mkdir -p "$RUNNER_TEMP/herald-home/hermes" "$RUNNER_TEMP/herald-runtime"
          printf '%s\n' \
            "HOME=$RUNNER_TEMP/herald-home" \
            "HERMES_HOME=$RUNNER_TEMP/herald-home/hermes" \
            "HERMES_RUNTIME_DIR=$RUNNER_TEMP/herald-runtime" >> "$GITHUB_ENV"

      - name: Check out Hermes Herald
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Check out compatible Hermes Agent source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.ref }}
          path: hermes-agent

      - name: Set up host Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up locked legacy installer
        if: matrix.host == 'legacy'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.13"

      - name: Build legacy locked test environment
        if: matrix.host == 'legacy'
        working-directory: hermes-agent
        run: |
          mkdir -p "$HERMES_HOME"
          export UV_PROJECT_ENVIRONMENT="$HOME/.ci-venv"
          uv sync --locked --python 3.11 --extra dev --extra anthropic

      - name: Build current PM test environment
        if: matrix.host != 'legacy'
        working-directory: hermes-agent
        run: |
          mkdir -p "$HERMES_HOME"
          python -m pm.build_env --source . --out "$HOME/.ci-venv" --group dev --group test

      - name: Verify current host without PyYAML
        if: matrix.host != 'legacy'
        run: scripts/ci-python -c 'import importlib.util; assert importlib.util.find_spec("yaml") is None'

      - name: Verify candidate transport source locality
        if: matrix.host == 'host-candidate'
        run: |
          scripts/ci-python -c '
          import os
          from pathlib import Path
          import agent.subagent_lifecycle as lifecycle
          import hermes_cli.plugin_host as host
          import tools.delegate_tool as delegate
          source = Path(os.environ["HERMES_SOURCE_DIR"]).resolve()
          for module in (lifecycle, host, delegate):
              path = Path(module.__file__).resolve()
              assert path.is_relative_to(source), (path, source)
              print(path)
          assert callable(delegate._credential_overrides)
          '

      - name: Release contract
        run: scripts/ci-python scripts/check_release_contract.py

      - name: Run Hermes Herald tests
        env:
          HERMES_PYTHON: ${{ github.workspace }}/scripts/ci-python
          HERALD_CI_ISOLATION: ${{ matrix.isolation }}
        run: |
          tests=()
          for test in "$PWD"/tests/test_*.py; do
            if [[ "$HERALD_CI_ISOLATION" == in_process && "${test##*/}" == test_host_subagent_lifecycle.py ]]; then
              printf 'Omit %s: requires unreleased isolated-host transport; covered by host-candidate\n' "$test"
              continue
            fi
            tests+=("$test")
          done
          printf 'Selected (%s): %s\n' "$HERALD_CI_ISOLATION" "${tests[*]}"
          bash hermes-agent/scripts/run_tests.sh "${tests[@]}" -j 2 --file-retries 0 \
            -p no:cacheprovider -o addopts= --confcutdir="$PWD/tests" --rootdir="$PWD/tests" -q
